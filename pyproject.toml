[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-scanner"
version = "0.4.1"
description = "A lightweight web application vulnerability scanner for authorised testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tejasva" }]
keywords = ["security", "web", "vulnerability", "scanner", "pentest", "owasp", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience:: Developers",
    "Intended Audience:: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
windows = ["colorama>=0.4.6"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tejasva-cyber/web-vuln-scanner"
Repository = "https://github.com/tejasva-cyber/web-vuln-scanner"
Issues = "https://github.com/tejasva-cyber/web-vuln-scanner/issues"

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools]
packages = ["argus", "argus.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
